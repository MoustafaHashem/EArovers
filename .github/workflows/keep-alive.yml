name: Supabase Keep-Alive

on:
  schedule:
    # Run daily at 6:00 AM UTC to prevent Supabase free tier from pausing
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Application Health Route
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}/api/health/ping"
